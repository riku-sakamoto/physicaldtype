
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build manylinux wheel
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_BUILD: cp312-manylinux_x86_64

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: wheelhouse/*.whl

